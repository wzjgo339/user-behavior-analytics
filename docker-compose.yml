# 日志配置：所有容器日志自动轮转，防止磁盘写满
x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ===== 消息队列 =====
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: always
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    logging: *default-logging
    networks: [analytics-net]

  # ===== 分析数据库 =====
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: always
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - ./db/clickhouse/init:/docker-entrypoint-initdb.d
      - clickhouse-data:/var/lib/clickhouse
    logging: *default-logging
    networks: [analytics-net]

  # ===== 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports: ["6379:6379"]
    logging: *default-logging
    networks: [analytics-net]

  # ===== 业务数据库 =====
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: analysis
    volumes:
      - ./db/mysql/init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    logging: *default-logging
    networks: [analytics-net]

  # ===== 后端 API 服务（Spring Boot 3）=====
  server:
    build: ./server
    container_name: server
    restart: always
    ports: ["8080:8080"]
    depends_on: [clickhouse, redis]
    logging: *default-logging
    networks: [analytics-net]

  # ===== Web 服务器 =====
  nginx:
    build: ./nginx
    container_name: nginx
    restart: always
    ports: ["80:80"]
    volumes:
      - nginx-logs:/var/log/nginx
    logging: *default-logging
    networks: [analytics-net]

  # ===== 日志采集器（依赖 Nginx 和 Kafka 就绪）=====
  filebeat:
    build: ./filebeat
    container_name: filebeat
    restart: always
    user: root
    depends_on: [nginx, kafka]
    volumes:
      - nginx-logs:/var/log/nginx:ro
    logging: *default-logging
    networks: [analytics-net]

networks:
  analytics-net:
    driver: bridge

volumes:
  clickhouse-data:
  mysql-data:
  nginx-logs:
